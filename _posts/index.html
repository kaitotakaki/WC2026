<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tin World Cup 2026</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; line-height: 1.6; }
    h1 { color: #1a73e8; }
    .post { margin-bottom: 30px; border-bottom: 1px solid #ddd; padding-bottom: 20px; }
  </style>
</head>
<body>
  <h1>⚽ Tin tức World Cup 2026</h1>
  <p>Cập nhật tự động mỗi giờ.</p>
  
  {% for post in site.posts limit: 20 %}
  <div class="post">
    <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
    <small>{{ post.date | date: "%d/%m/%Y %H:%M" }}</small>
    <p>{{ post.excerpt }}</p>
    <a href="{{ post.url }}">Đọc tiếp →</a>
  </div>
  {% endfor %}
</body>
</html>
